name: Process Event Submission PR

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Ensure events.json exists
        run: |
          if [ ! -f events.json ]; then
            echo "[]" > events.json
          fi

      - name: Extract and validate event from PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/process-form.js "${{ github.event.pull_request.body }}"
