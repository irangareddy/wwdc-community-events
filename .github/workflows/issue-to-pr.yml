name: Create PR from Event Issue

on:
  issues:
    types: [opened, labeled]

jobs:
  create-pr:
    if: contains(join(',', github.event.issue.labels.*.name), 'event submission')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Log issue details
        run: |
          echo "Issue Title: ${{ github.event.issue.title }}"
          echo "Issue Labels: ${{ toJson(github.event.issue.labels) }}"

      - name: Parse issue and create PR body
        run: |
          mkdir -p tmp
          echo '${{ toJson(github.event.issue.body) }}' > tmp/issue.json
          node scripts/form-issue.js tmp/issue.json

      - name: Install dependencies for validation
        run: npm install ajv-cli

      - name: Validate events.json
        run: |
          echo "Validating events.json against schema.json..."
          npx ajv-cli validate -s schema.json -d events.json || echo "Validation failed, but continuing with PR creation"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "Add event from issue #${{ github.event.issue.number }}"
          title: "Add event from issue #${{ github.event.issue.number }}"
          body-path: "tmp/pr-body.txt"
          branch: "add-event-${{ github.event.issue.number }}"