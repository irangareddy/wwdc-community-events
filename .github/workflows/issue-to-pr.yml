name: Create PR from Event Issue

on:
  issues:
    types: [opened, labeled]

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v3

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: 📦 Install Python dependencies
        run: pip install jsonschema

      - name: 🧠 Parse issue and update events.json
        run: |
          echo "🗂️ Creating tmp/ directory..."
          mkdir -p tmp
          echo "${{ github.event.issue.body }}" > tmp/issue.md
          echo "📄 Parsing issue with form_issue.py..."
          python3 scripts/form_issue.py tmp/issue.md

      - name: 🚀 Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "Add event from issue #${{ github.event.issue.number }}"
          title: "Add event from issue #${{ github.event.issue.number }}"
          body-path: "tmp/pr-body.txt"
          branch: "add-event-${{ github.event.issue.number }}"
